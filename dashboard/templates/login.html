<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VELTRIX AI Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#020617;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.login-box{

    width:400px;

    background:#07143a;

    padding:40px;

    border-radius:20px;

    box-shadow:0 0 30px rgba(0,0,0,0.5);

}

.logo{

    text-align:center;

    font-size:32px;

    color:#7CFFB2;

    margin-bottom:10px;

    font-weight:bold;

}

.tagline{

    text-align:center;

    color:#94a3b8;

    margin-bottom:30px;

}

input{

    width:100%;

    padding:16px;

    margin-bottom:20px;

    border:none;

    border-radius:12px;

    background:#101d42;

    color:white;

    font-size:16px;

}

button{

    width:100%;

    padding:16px;

    border:none;

    border-radius:12px;

    background:#7CFFB2;

    color:black;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

}

button:hover{

    opacity:0.9;

}

</style>

</head>

<body>

<div class="login-box">

    <div class="logo">
        🚀 VELTRIX AI
    </div>

    <div class="tagline">
        Institutional Intelligence Trading Terminal
    </div>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            LOGIN
        </button>

    </form>

</div>

</body>
</html>
