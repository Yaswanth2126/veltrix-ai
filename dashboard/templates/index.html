<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VELTRIX AI</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#020617;
    color:white;
}

.main{
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */

.sidebar{

    width:250px;

    background:#071028;

    padding:25px;
}

.logo{

    font-size:30px;

    font-weight:bold;

    color:#7CFFB2;

    margin-bottom:40px;
}

.menu{

    display:flex;

    flex-direction:column;

    gap:15px;
}

.menu a{
    text-decoration:none;
}

.menu button{

    width:100%;

    padding:18px;

    background:#101d42;

    border:none;

    border-radius:12px;

    color:white;

    font-size:16px;

    text-align:left;

    cursor:pointer;
}

.menu button:hover{

    background:#1a2c63;
}

/* CONTENT */

.content{

    flex:1;

    padding:25px;
}

/* CARDS */

.cards{

    display:grid;

    grid-template-columns:repeat(5,1fr);

    gap:20px;

    margin-bottom:25px;
}

.card{

    background:#07143a;

    padding:25px;

    border-radius:18px;
}

.card h3{

    color:#94a3b8;

    margin-bottom:10px;
}

.card h1{

    font-size:30px;
}

/* GRID */

.grid{

    display:grid;

    grid-template-columns:2fr 1fr;

    gap:25px;

    margin-bottom:25px;
}

.panel{

    background:#07143a;

    border-radius:18px;

    padding:20px;
}

.panel-title{

    font-size:22px;

    color:#7CFFB2;

    margin-bottom:20px;
}

.watch-item{

    display:flex;

    justify-content:space-between;

    background:#101d42;

    padding:15px;

    border-radius:12px;

    margin-bottom:12px;
}

.signal-card{

    display:flex;

    justify-content:space-between;

    align-items:center;

    background:#101d42;

    padding:15px;

    border-radius:12px;

    margin-bottom:12px;
}

.signal-confidence{

    background:#16a34a;

    padding:8px 14px;

    border-radius:10px;

    font-weight:bold;
}

/* CHART */

#tradingview_chart{

    height:500px;
}

/* TABLE */

.trade-table{

    width:100%;

    border-collapse:collapse;
}

.trade-table th{

    background:#101d42;

    padding:15px;
}

.trade-table td{

    padding:15px;

    text-align:center;

    border-bottom:1px solid rgba(255,255,255,0.05);
}

.profit{

    color:#7CFFB2;

    font-weight:bold;
}

.loss{

    color:#ff6b81;

    font-weight:bold;
}

</style>

</head>

<body>

<div class="main">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="logo">
            🚀 VELTRIX AI
        </div>

        <div class="menu">

            <button>📊 Dashboard</button>

            <button>🧠 AI Signals</button>

            <button>💼 Portfolio</button>

            <button>📈 Analytics</button>

            <button>📑 Orders</button>

            <button>⚙ Settings</button>

            <a href="/logout">

                <button>
                    🚪 Logout
                </button>

            </a>

        </div>

    </div>

    <!-- CONTENT -->

    <div class="content">

        <!-- TOP CARDS -->

        <div class="cards">

            <div class="card">

                <h3>MARKET</h3>

                <h1 id="market">BULLISH</h1>

            </div>

            <div class="card">

                <h3>PORTFOLIO</h3>

                <h1 id="portfolio">₹0</h1>

            </div>

            <div class="card">

                <h3>POSITIONS</h3>

                <h1 id="positions">0</h1>

            </div>

            <div class="card">

                <h3>WIN RATE</h3>

                <h1 id="winrate">0%</h1>

            </div>

            <div class="card">

                <h3>P&L</h3>

                <h1 id="pnl">₹0</h1>

            </div>

        </div>

        <!-- MAIN GRID -->

        <div class="grid">

            <!-- CHART -->

            <div class="panel">

                <div class="panel-title">
                    📈 LIVE MARKET
                </div>

                <div id="tradingview_chart"></div>

            </div>

            <!-- SIDE PANEL -->

            <div>

                <div class="panel">

                    <div class="panel-title">
                        🔥 WATCHLIST
                    </div>

                    <div id="watchlist"></div>

                </div>

                <br>

                <div class="panel">

                    <div class="panel-title">
                        🧠 AI SIGNALS
                    </div>

                    <div id="signals"></div>

                </div>

            </div>

        </div>

        <!-- TRADE TABLE -->

        <div class="panel">

            <div class="panel-title">
                📑 PAPER TRADE HISTORY
            </div>

            <table class="trade-table">

                <thead>

                    <tr>

                        <th>STOCK</th>
                        <th>ENTRY</th>
                        <th>EXIT</th>
                        <th>P&L</th>

                    </tr>

                </thead>

                <tbody id="tradeTable">

                </tbody>

            </table>

        </div>

    </div>

</div>

<script>

new TradingView.widget({

    "width":"100%",

    "height":500,

    "symbol":"NSE:NIFTY",

    "interval":"5",

    "timezone":"Asia/Kolkata",

    "theme":"dark",

    "style":"1",

    "locale":"en",

    "toolbar_bg":"#07143a",

    "enable_publishing":false,

    "container_id":"tradingview_chart"

});

async function loadMarketData(){

    const response =
        await fetch('/market-data');

    const data =
        await response.json();

    // TOP CARDS

    document.getElementById("market").innerText =
        data.market;

    document.getElementById("portfolio").innerText =
        "₹" + data.portfolio.toLocaleString();

    document.getElementById("positions").innerText =
        data.positions;

    document.getElementById("winrate").innerText =
        data.winrate + "%";

    document.getElementById("pnl").innerText =
        "₹" + data.pnl.toLocaleString();

    // WATCHLIST

    const watchlist =
        document.getElementById("watchlist");

    watchlist.innerHTML = "";

    data.watchlist.forEach(stock => {

        watchlist.innerHTML += `

            <div class="watch-item">

                <span>${stock.name}</span>

                <span>₹${stock.price}</span>

            </div>

        `;

    });

    // SIGNALS

    const signals =
        document.getElementById("signals");

    signals.innerHTML = "";

    data.signals.forEach(signal => {

        signals.innerHTML += `

            <div class="signal-card">

                <div>

                    <strong>${signal.stock}</strong><br>

                    ${signal.signal}

                </div>

                <div class="signal-confidence">

                    ${signal.confidence}%

                </div>

            </div>

        `;

    });

    // TRADES

    const tradeTable =
        document.getElementById("tradeTable");

    tradeTable.innerHTML = "";

    (data.trades || []).forEach(trade => {

        const pnlClass =
            trade.pnl >= 0 ? "profit" : "loss";

        tradeTable.innerHTML += `

            <tr>

                <td>${trade.stock}</td>

                <td>₹${trade.entry}</td>

                <td>₹${trade.exit}</td>

                <td class="${pnlClass}">
                    ₹${trade.pnl}
                </td>

            </tr>

        `;

    });

}

loadMarketData();

setInterval(() => {

    loadMarketData();

}, 5000);

</script>
<div class="ai-chat-box">
    <h2>🤖 VELTRIX AI Assistant</h2>

    <input type="text" id="userMessage" placeholder="Ask VELTRIX AI..." />

    <button onclick="sendMessage()">Ask AI</button>

    <div id="aiResponse"></div>
</div>

<script>
async function sendMessage() {

    const message =
        document.getElementById("userMessage").value;

    const response = await fetch("/chat", {
        method: "POST",

        headers: {
            "Content-Type":
            "application/x-www-form-urlencoded"
        },

        body:
        "message=" +
        encodeURIComponent(message)
    });

    const data = await response.json();

    document.getElementById("aiResponse").innerHTML =
        "<p>" + data.reply + "</p>";
}
</script>
<div class="ai-chat-box">
    <h2>🤖 VELTRIX AI Assistant</h2>

    <input
        type="text"
        id="userMessage"
        placeholder="Ask VELTRIX AI..."
    >

    <button onclick="sendMessage()">
        Ask AI
    </button>

    <div id="aiResponse"></div>
</div>

<script>

async function sendMessage(){

    const message =

    const response =
        await fetch("/chat", {

            method:"POST",

            headers:{
                "Content-Type":
                "application/x-www-form-urlencoded"
            },

            body:
            "message=" +
            encodeURIComponent(message)

        });

    const data =
        await response.json();

    document.getElementById("aiResponse").innerHTML =
        data.reply;
}

</script>
</body>


</html>
